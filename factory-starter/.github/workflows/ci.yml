# The deterministic gates. Make all five jobs required status checks on main
# (Settings > Branches or Rulesets) so nothing merges red, including auto-merge. In team mode
# dispatch.sh copies main's classic branch protection onto each feature/<f>, and the feature gate
# (check job) refuses to merge a feature whose branch lacks it.
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# Every check script and rule file comes from main (RULES), never from the pull request, so a pull
# request cannot relax its own gate. Main, not the base branch: a feature branch keeps the factory
# from the day it was dispatched, and its pull requests are held to today's checks all the same.
# The base branch is still what each check compares the pull request with.
env:
  RULES: origin/main

permissions:
  contents: read
  pull-requests: read
  issues: read          # risk-gate reads who added the human-approved label, and when

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Add your toolchain setup here (for example actions/setup-node), then:
      - run: make check
      - run: make accept
      - name: Generated code matches contracts/
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          # Main's copy of the check (RULES), so a pull request cannot relax it; the pull
          # request's copy only before it exists there (and on pushes to main).
          if [ -n "${GITHUB_BASE_REF:-}" ] && git cat-file -e "$RULES:factory/scripts/check-contracts.sh" 2>/dev/null; then
            git show "$RULES:factory/scripts/check-contracts.sh" > /tmp/check-contracts.sh
          else
            cp factory/scripts/check-contracts.sh /tmp/check-contracts.sh
          fi
          bash /tmp/check-contracts.sh
      - name: Research briefs are sourced
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          # Every research/**/brief.md the pull request adds or changes: each finding cites a source
          # that quotes it, anything unsourced is a labelled assumption or hypothesis. The base
          # branch's copy of the check, like the contracts step; the pull request's only before.
          if git cat-file -e "$RULES:factory/scripts/check-brief.sh" 2>/dev/null; then
            git show "$RULES:factory/scripts/check-brief.sh" > /tmp/check-brief.sh
          else
            cp factory/scripts/check-brief.sh /tmp/check-brief.sh
          fi
          bash /tmp/check-brief.sh --changed "$BASE"
      - name: Acceptance tests unchanged since the tests commit
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}    # sync/<f>: exempt, it brings main's files unchanged
        run: |
          if git cat-file -e "$RULES:factory/scripts/check-acceptance-lock.sh" 2>/dev/null; then
            git show "$RULES:factory/scripts/check-acceptance-lock.sh" > /tmp/check-acceptance-lock.sh
          else
            cp factory/scripts/check-acceptance-lock.sh /tmp/check-acceptance-lock.sh
          fi
          bash /tmp/check-acceptance-lock.sh "$BASE"
      - name: Feature gate
        # Team mode: a feature reaches main only from integrate/<f>, once its e2e report and research's
        # acceptance review pass, feature/<f> is protected like main and `make e2e` passes here; a
        # feature branch takes only its own feature's items. A step in this job, not a job of its own:
        # a skipped required job counts as passing, so the gate always runs and decides inside.
        # Main's copy, like the contracts step; the pull request's only before it exists.
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}     # reads branch protection of main and feature/<f>
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/feat
          if git cat-file -e "$RULES:factory/scripts/check-feature.sh" 2>/dev/null; then
            git show "$RULES:factory/scripts/check-feature.sh" > /tmp/feat/check-feature.sh
          else
            cp factory/scripts/check-feature.sh /tmp/feat/check-feature.sh
          fi
          bash /tmp/feat/check-feature.sh "$BASE"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # When there is code worth scanning, add a SAST step (for example Semgrep)
      # and your ecosystem's dependency audit here. Tools, not agents.

  factory-tests:
    # Tests for the factory's own scripts and hooks (factory/tests/). They guard the guards.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A pull request that leaves the factory as it is has nothing here to test: the suite takes
      # minutes, and product pull requests should not wait on it. Pushes to main always run it.
      - name: Run when the factory changed
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ] && git diff --quiet "origin/$BASE...HEAD" -- factory .claude .github teams docs/factory; then
            echo "This pull request does not change the factory: its tests are skipped."
          else
            factory/tests/run.sh
          fi

  ownership:
    # Team mode (factory/teams.json): a pull request changes only its own team's paths. The check
    # comes from main and the roster from the base branch, never from the pull request, so it cannot
    # widen its own ownership. A base branch without a roster is a single-team factory: nothing to check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Paths owned by the pull request's team
        env:
          BASE: origin/${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          # contracts/ in a team's pull request: its ticket's labels are read with gh
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if git cat-file -e "$RULES:factory/scripts/check-ownership.sh" 2>/dev/null; then
            mkdir -p /tmp/own
            git show "$RULES:factory/scripts/check-ownership.sh" > /tmp/own/check-ownership.sh
            git show "$RULES:factory/scripts/lib.sh" > /tmp/own/lib.sh
            bash /tmp/own/check-ownership.sh "$BASE"
          else
            echo "No ownership check on $RULES: a single-team factory."
          fi
      - name: Approved decisions only gain status superseded
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          if git cat-file -e "$RULES:factory/scripts/decisions.sh" 2>/dev/null; then
            mkdir -p /tmp/dec
            git show "$RULES:factory/scripts/decisions.sh" > /tmp/dec/decisions.sh
            git show "$RULES:factory/scripts/lib.sh" > /tmp/dec/lib.sh
            bash /tmp/dec/decisions.sh check-append-only "$BASE"
          else
            echo "No decisions check on $RULES yet."
          fi

  risk-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify risk using the base branch's rules
        id: risk
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          # Use main's copy of the scripts and rules, so a pull request
          # cannot relax its own gate. Fall back to the PR's copy only for a
          # file that does not exist on main yet.
          mkdir -p /tmp/risk
          for f in scripts/classify-risk.sh risk-rules.txt scripts/risk-tier.sh scripts/check-specialists.sh scripts/lib.sh; do
            if git cat-file -e "$RULES:factory/$f" 2>/dev/null; then
              git show "$RULES:factory/$f" > "/tmp/risk/${f##*/}"
            elif [ -f "factory/$f" ]; then
              cp "factory/$f" "/tmp/risk/${f##*/}"
            fi
          done
          # The tier is the highest of the path rules, the spec's risk_floor, the floors of the
          # decision records it names and the RISK of every report in its work folder. Until
          # main has risk-tier.sh, the path rules alone, as before; never the PR's own copy.
          if git cat-file -e "$RULES:factory/scripts/risk-tier.sh" 2>/dev/null; then
            tier=$(RISK_RULES=/tmp/risk/risk-rules.txt bash /tmp/risk/risk-tier.sh "$BASE")
          else
            tier=$(RISK_RULES=/tmp/risk/risk-rules.txt bash /tmp/risk/classify-risk.sh "$BASE")
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "Risk tier: $tier" >> "$GITHUB_STEP_SUMMARY"
      - name: Specialists' reports
        env:
          TIER: ${{ steps.risk.outputs.tier }}
          BASE: origin/${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}    # integrate/<f>: exempt, its items passed on feature/<f>
        run: |
          # Team mode: the work item carries a passing report from each specialist its tier,
          # team and paths call for (review, ui-review, security, db-review). main's copy of the
          # check, like the classifier, and the base branch's roster; none on main yet, nothing to check.
          if git cat-file -e "$RULES:factory/scripts/check-specialists.sh" 2>/dev/null; then
            bash /tmp/risk/check-specialists.sh "$BASE" "$TIER"
          else
            echo "No specialists' check on $RULES yet."
          fi
      - name: Enforce the human gate
        env:
          TIER: ${{ steps.risk.outputs.tier }}
          BASE: origin/${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Your GitHub login. Agents work as a bot account, so only a label you add counts.
          FACTORY_HUMAN: ${{ vars.FACTORY_HUMAN }}
        run: |
          case "$TIER" in
            R0|R1)
              echo "No human gate for $TIER." ;;
            R2)
              # AUTONOMY=on in main's policy: no label for a change that leaves the factory as main
              # has it (autonomy-gate.sh). Main's copy only, never the pull request's: a PR must
              # not bring the gate that lets itself through.
              if git cat-file -e "$RULES:factory/scripts/autonomy-gate.sh" 2>/dev/null; then
                git show "$RULES:factory/scripts/autonomy-gate.sh" > /tmp/autonomy-gate.sh
                if out=$(bash /tmp/autonomy-gate.sh "$BASE" "$RULES" "$TIER" 2>&1); then
                  echo "$out"
                  exit 0
                fi
                echo "$out"
              fi
              # The label must be yours and newer than the last push (check-approval.sh), using
              # main's copy of the check, like the classifier.
              if git cat-file -e "$RULES:factory/scripts/check-approval.sh" 2>/dev/null; then
                git show "$RULES:factory/scripts/check-approval.sh" > /tmp/approval.sh
              else
                cp factory/scripts/check-approval.sh /tmp/approval.sh
              fi
              if ! out=$(bash /tmp/approval.sh "$PR" human-approved 2>&1); then
                echo "::error::R2 change. ${out#approval: }"
                exit 1
              fi
              echo "$out" ;;
            R3)
              echo "::error::R3 change. The factory does not make these; a human does, outside this pipeline."
              exit 1 ;;
            *)
              echo "::error::Unknown tier '$TIER'."
              exit 1 ;;
          esac
